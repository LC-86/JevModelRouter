name: Publish release to CDN

# When a release is PUBLISHED (release.yml only creates drafts — publishing the
# draft is "shipping it"), upload its installers and signed updater artifacts
# to the R2 bucket behind cdn.autojev.ai and rewrite latest.json, the feed the
# desktop app's updater polls.
#
# Required secrets (repo Settings → Secrets → Actions):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY — R2 API token (S3) for bucket autojev
#   CLOUDFLARE_ACCOUNT_ID                  — the Cloudflare account id
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the release's installers (all platforms)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "AutoJev_*" --dir dist
          ls -lh dist

      - name: Upload to R2 and rewrite latest.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/publish-release.sh dist/AutoJev_*
